# Test configuration - disable security for tests
# Configuration de test - désactive la sécurité pour les tests

# Disable security
spring.autoconfigure.exclude=com.example.muscul_ia.config.SecurityConfig

# Use in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console for debugging
spring.h2.console.enabled=true

# JPA/Hibernate settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable JWT for tests
jwt.secret=test-secret-key-for-testing-only
jwt.expiration=86400000 