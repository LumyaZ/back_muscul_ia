# Test configuration - optimized for integration tests
# Configuration de test - optimisée pour les tests d'intégration

# Database configuration for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console for debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable security completely for tests
spring.autoconfigure.exclude=com.example.muscul_ia.config.SecurityConfig,com.example.muscul_ia.config.JwtAuthenticationFilter
spring.security.enabled=false

# JWT configuration for tests
jwt.secret=test-secret-key-for-testing-only-make-it-long-enough
jwt.expiration=86400000

# Logging configuration for tests
logging.level.root=WARN
logging.level.com.example.muscul_ia=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG

# Disable metrics for tests
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Test specific settings
spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

# Disable async processing for tests
spring.task.execution.pool.core-size=1
spring.task.execution.pool.max-size=1
spring.task.execution.pool.queue-capacity=10

# Disable caching for tests
spring.cache.type=none

# Disable scheduling for tests
spring.task.scheduling.pool.size=1 